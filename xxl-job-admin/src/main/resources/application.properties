### web
server.port=8080
server.servlet.context-path=/xxl-job-admin

### actuator
management.endpoints.web.base-path=/actuator
management.health.mail.enabled=false

### resources
spring.mvc.servlet.load-on-startup=0
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

### freemarker
spring.freemarker.templateLoaderPath=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.charset=UTF-8
spring.freemarker.request-context-attribute=request
spring.freemarker.settings.number_format=0.##########
spring.freemarker.settings.new_builtin_class_resolver=safer

### mybatis
mybatis.mapper-locations=classpath:/mapper/*Mapper.xml

### datasource-pool
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=1000

### xxl-job, datasource
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

### xxl-job, email
spring.mail.host=smtp.qq.com
spring.mail.port=25
spring.mail.username=xxx@qq.com
spring.mail.from=xxx@qq.com
spring.mail.password=xxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

### xxl-job, access token
xxl.job.accessToken=default_token

### xxl-job, timeout by second, default 3s
xxl.job.timeout=3

### xxl-job, i18n (default is zh_CN, and you can choose "zh_CN", "zh_TC" and "en")
xxl.job.i18n=zh_CN

## xxl-job, triggerpool max size
xxl.job.triggerpool.fast.max=300
xxl.job.triggerpool.slow.max=200

### xxl-job, log retention days
xxl.job.logretentiondays=30

### xxl-sso
xxl-sso.token.key=xxl_job_login_token
xxl-sso.token.timeout=604800000
xxl-sso.client.excluded.paths=/auth/sso/login,/auth/sso/redirect
xxl-sso.client.login.path=/auth/sso/redirect

### xxl-job-admin SSO (单点登录配置)
## 启用/禁用SSO功能
xxl.job.sso.enabled=false

## 预共享密钥（与企业运营后台一致）
## 要求：至少32个字符的强随机字符串
xxl.job.sso.secret=please-change-this-to-a-strong-secret-key-at-least-32-characters

## 来自企业运营后台的SSO Token有效期（秒）
## 用于验证企业运营后台发来的登录Token
xxl.job.sso.token.expire.seconds=300

## 登录失败时的跳转URL
xxl.job.sso.login.failure.url=/auth/login

## 企业运营后台的SSO入口URL（用于状态同步）
## 当xxl-job-admin的Token过期且无法刷新时，重定向到此URL
## 格式示例：http://enterprise-host:port/enterprise/sso/xxl-job-redirect
xxl.job.sso.enterprise.sso.url=

## === 双Token机制配置 ===
## Access Token有效期（秒）- 默认30分钟
xxl.job.sso.access.token.expire.seconds=1800

## Refresh Token有效期（秒）- 默认7天
xxl.job.sso.refresh.token.expire.seconds=604800

## Refresh Token加密密钥（Base64编码，32字节）
## 如未配置，将从secret派生
## 生成方式：openssl rand -base64 32
xxl.job.sso.refresh.token.encrypt.key=

## State参数有效期（秒）- 用于防止CSRF攻击
xxl.job.sso.state.expire.seconds=300
